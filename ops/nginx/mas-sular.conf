# Mas Sular — reverse proxy (staging). Installed to /opt/mas-sular/nginx/conf.d/
# (mounted read-only into the mas-sular-nginx container, which is on the
# mas-sular_edge network). Validate before reloading:
#   docker exec mas-sular-nginx nginx -t && docker exec mas-sular-nginx nginx -s reload
#
# Hardening (staging readiness follow-up):
#   - server_tokens off
#   - access logs never record query strings, capability-token path segments or
#     the Referer (H2: admin JWTs were found in the old "$request" log lines)
#   - unknown Host / SNI is rejected instead of being routed to the storefront
#   - explicit 10 MB request-body limit on the API (E7; the app rejects > 8 MB)
#   - /metrics is not reachable from the internet (M1)
#   - the JNE webhook is closed at the edge until JNE's source IPs are verified (M2)
#   - HSTS on the storefront and admin (the apps send CSP / X-Frame-Options /
#     nosniff / Referrer-Policy themselves; the API sends its own via helmet)

server_tokens off;

# Resolve the app containers through Docker's embedded DNS AT REQUEST TIME. With a
# literal `proxy_pass http://backend:3001` nginx resolves the name once at start-up,
# so recreating a container (new IP) turns every request into a 502 until nginx is
# reloaded - observed during the 2026-09-13 redeploy. A variable upstream plus this
# resolver re-resolves (cached 10s) and survives container recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------------------------------------------------------------- logging ----
# Capability tokens live in these paths (payment-receipt upload links, customer
# invoice links); keep the path shape, drop the secret.
map $uri $ms_loggable_uri {
    "~^(?<p>/api/v\d+/payments/upload/)[^/]+(?<rest>.*)$"  "${p}[REDACTED]${rest}";
    "~^(?<p>/api/v\d+/invoices/)[^/]+(?<rest>.*)$"         "${p}[REDACTED]${rest}";
    "~^(?<p>/payment/)[^/]+(?<rest>.*)$"                   "${p}[REDACTED]${rest}";
    "~^(?<p>/invoice/)[^/]+(?<rest>.*)$"                   "${p}[REDACTED]${rest}";
    default                                                $uri;
}

# $uri has no query string; no Referer (it can carry the same capability paths).
log_format ms_safe '$remote_addr - [$time_local] "$request_method $ms_loggable_uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent" rt=$request_time host=$host';

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:ms_ssl:10m;
ssl_session_timeout 1h;

# ------------------------------------------------------- default servers ----
# Anything that is not one of the three named hosts: close the connection (80)
# or refuse the TLS handshake (443). ACME HTTP-01 for the named hosts is served
# by their own :80 blocks below.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log ms_safe;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/access.log ms_safe;
    ssl_reject_handshake on;
}

# ------------------------------------------------------------- storefront ----
server {
    listen 80;
    server_name staging-ecommerce.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-ecommerce.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        set $ms_upstream http://frontend:3000;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------------- API ----
server {
    listen 80;
    server_name staging-api.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-api.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/privkey.pem;

    # E7: payment-receipt photos. The application enforces a stricter 8 MB cap.
    client_max_body_size 10m;

    # M1: Prometheus metrics are internal-only (scrape backend:3001 on the Docker
    # network). The application refuses proxied /metrics requests as well.
    location = /metrics {
        return 404;
    }

    # M2: JNE Webhook Status V2 has no request authentication. Keep it closed at the
    # edge until JNE supplies (in writing) the source IPs it pushes from. To enable:
    #   1. replace `return 403;` with one `allow <JNE-IP>;` per verified address,
    #      followed by `deny all;` and the proxy_* lines of `location /` below;
    #   2. set JNE_WEBHOOK_ENABLED=true in production.env and recreate the backend.
    location = /api/v1/shipments/webhook/jne {
        return 403;
    }

    # H2: the admin notification stream (Server-Sent Events). Authenticated by the
    # session cookie - never a URL token. Unbuffered so events arrive immediately;
    # the backend sends a heartbeat every 30s, well inside the read timeout.
    location = /api/v1/admin/notifications/stream {
        set $ms_upstream http://backend:3001;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        set $ms_upstream http://backend:3001;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------ admin ----
server {
    listen 80;
    server_name staging-admin.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-admin.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        set $ms_upstream http://admin:3002;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
