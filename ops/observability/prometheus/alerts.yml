# Alert rules for the Mas Sular outbox/notification pipeline.
# Metric names are produced by Phase 7B1 (masular_*) and the RabbitMQ Prometheus
# plugin (rabbitmq_queue_messages). Two-tier severities: warning -> Slack,
# critical -> pager. Inhibition (alertmanager.yml) suppresses the warning when the
# critical for the same alertname+pipeline is firing, so paging stays quiet.
groups:
  - name: masular-pipeline-p0
    rules:
      # --- Relay terminal failures (publish exhausted -> FAILED) ---
      - alert: RelayFailedGrowth
        expr: increase(masular_relay_failed_total[15m]) > 10
        for: 5m
        labels:
          severity: critical
          pipeline: relay
        annotations:
          summary: 'Outbox relay is terminally failing events'
          description: '{{ $value | printf "%.0f" }} OutboxEvent rows moved to FAILED in 15m (threshold 10). The relay cannot deliver to the broker.'
          runbook: 'ops/observability/README.md#relayfailedgrowth'
      - alert: RelayFailedGrowth
        expr: increase(masular_relay_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          pipeline: relay
        annotations:
          summary: 'Outbox relay produced FAILED events'
          description: '{{ $value | printf "%.0f" }} OutboxEvent rows FAILED in 15m. Investigate before the backlog grows.'
          runbook: 'ops/observability/README.md#relayfailedgrowth'

      # --- Notification terminal failures (permanent + retries exhausted) ---
      - alert: NotificationFailedGrowth
        expr: (increase(masular_notification_sender_failed_permanent_total[15m]) + increase(masular_notification_sender_failed_exhausted_total[15m])) > 10
        for: 5m
        labels:
          severity: critical
          pipeline: notification
        annotations:
          summary: 'Notifications are terminally failing'
          description: '{{ $value | printf "%.0f" }} notifications moved to FAILED in 15m (threshold 10). Recipients are not being emailed.'
          runbook: 'ops/observability/README.md#notificationfailedgrowth'
      - alert: NotificationFailedGrowth
        expr: (increase(masular_notification_sender_failed_permanent_total[15m]) + increase(masular_notification_sender_failed_exhausted_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          pipeline: notification
        annotations:
          summary: 'Notifications are failing'
          description: '{{ $value | printf "%.0f" }} notifications FAILED in 15m. Check the provider and recipient validity.'
          runbook: 'ops/observability/README.md#notificationfailedgrowth'

      # --- Consumer dead-letter queue depth (broker-sourced) ---
      - alert: DLQDepth
        expr: max(rabbitmq_queue_messages{queue="order.created.notifications.dlq"}) > 10
        for: 5m
        labels:
          severity: critical
          pipeline: notification
        annotations:
          summary: 'Consumer DLQ is filling up'
          description: '{{ $value | printf "%.0f" }} messages in order.created.notifications.dlq (threshold 10). Poison messages are accumulating.'
          runbook: 'ops/observability/README.md#dlqdepth'
      - alert: DLQDepth
        expr: max(rabbitmq_queue_messages{queue="order.created.notifications.dlq"}) > 0
        for: 5m
        labels:
          severity: warning
          pipeline: notification
        annotations:
          summary: 'Messages present in the consumer DLQ'
          description: '{{ $value | printf "%.0f" }} message(s) in order.created.notifications.dlq. Inspect and redrive once the root cause is fixed.'
          runbook: 'ops/observability/README.md#dlqdepth'

      # --- Sender circuit breaker stuck open ---
      - alert: SenderBreakerOpen
        expr: masular_notification_sender_breaker_open == 1
        for: 5m
        labels:
          severity: critical
          pipeline: notification
        annotations:
          summary: 'Notification sender circuit breaker is open'
          description: 'The sender has been paused for >5m on sustained transient/infra failures (likely provider 5xx/401 or DB connectivity). No notifications are being sent.'
          runbook: 'ops/observability/README.md#senderbreakeropen'

      # --- Oldest unprocessed work not draining (relay + sender) ---
      - alert: OldestPendingAgeHigh
        expr: masular_relay_oldest_pending_age_seconds > 900
        for: 5m
        labels:
          severity: critical
          pipeline: relay
        annotations:
          summary: 'Oldest PENDING outbox event is stale (>15m)'
          description: 'Oldest PENDING OutboxEvent age is {{ $value | printf "%.0f" }}s. The relay is not draining its backlog.'
          runbook: 'ops/observability/README.md#oldestpendingagehigh'
      - alert: OldestPendingAgeHigh
        expr: masular_relay_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
          pipeline: relay
        annotations:
          summary: 'Oldest PENDING outbox event is aging (>5m)'
          description: 'Oldest PENDING OutboxEvent age is {{ $value | printf "%.0f" }}s.'
          runbook: 'ops/observability/README.md#oldestpendingagehigh'
      - alert: OldestPendingAgeHigh
        expr: masular_notification_sender_oldest_pending_age_seconds > 900
        for: 5m
        labels:
          severity: critical
          pipeline: notification
        annotations:
          summary: 'Oldest PENDING notification is stale (>15m)'
          description: 'Oldest PENDING NotificationOutbox age is {{ $value | printf "%.0f" }}s. The sender is not draining its backlog.'
          runbook: 'ops/observability/README.md#oldestpendingagehigh'
      - alert: OldestPendingAgeHigh
        expr: masular_notification_sender_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
          pipeline: notification
        annotations:
          summary: 'Oldest PENDING notification is aging (>5m)'
          description: 'Oldest PENDING NotificationOutbox age is {{ $value | printf "%.0f" }}s.'
          runbook: 'ops/observability/README.md#oldestpendingagehigh'

  - name: masular-pipeline-p1
    rules:
      # --- Retention worker stopped sweeping ---
      # Only fires when the gauge EXISTS but is stale (retention ran before, then
      # stopped). Does not fire when retention is intentionally disabled and the
      # metric was never emitted, avoiding noise in dev/default-off environments.
      - alert: RetentionNotRunning
        expr: (time() - masular_retention_last_run_timestamp_seconds) > 93600
        for: 1h
        labels:
          severity: warning
          pipeline: lifecycle
        annotations:
          summary: 'Retention sweep has not run in >26h'
          description: 'Last retention sweep was {{ $value | humanizeDuration }} ago (daily expectation). Terminal/expired rows will accumulate.'
          runbook: 'ops/observability/README.md#retentionnotrunning'
