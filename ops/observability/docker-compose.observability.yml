# Observability overlay for the Mas Sular pipeline.
# Run FROM THE REPO ROOT so bind-mount paths resolve:
#
#   docker compose -f docker-compose.yml -f ops/observability/docker-compose.observability.yml up -d
#
# Adds Prometheus, Alertmanager, and Grafana, and turns on the RabbitMQ
# Prometheus plugin (port 15692) with per-queue metrics for DLQ depth.
services:
  # Enable the rabbitmq_prometheus plugin + per-object metrics on the existing broker.
  rabbitmq:
    ports:
      - "15692:15692"
    volumes:
      - ./ops/observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./ops/observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: baso_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: baso_alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:11.2.0
    container_name: baso_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3002:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
