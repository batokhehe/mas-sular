# Edge proxy — http-level settings shared by every environment behind it.
# (Moved verbatim from the staging config's top half; defined ONCE here because
# nginx rejects a duplicate `map`/`log_format` across conf.d files.)
#
#   - server_tokens off
#   - access logs never record query strings, capability-token path segments or
#     the Referer (H2: admin JWTs were found in the old "$request" log lines)
#   - unknown Host / SNI is rejected instead of being routed to an application
#
# Validate before reloading:
#   docker exec mas-sular-nginx nginx -t && docker exec mas-sular-nginx nginx -s reload

server_tokens off;

# Resolve app containers through Docker's embedded DNS AT REQUEST TIME (variable
# upstream + resolver). A literal proxy_pass resolves once at start-up, so a
# recreated container (new IP) would 502 until reload; it would also stop nginx
# from STARTING while one environment's containers are down.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------------------------------------------------------------- logging ----
# Capability tokens live in these paths (payment-receipt upload links, customer
# invoice links); keep the path shape, drop the secret.
map $uri $ms_loggable_uri {
    "~^(?<p>/api/v\d+/payments/upload/)[^/]+(?<rest>.*)$"  "${p}[REDACTED]${rest}";
    "~^(?<p>/api/v\d+/invoices/)[^/]+(?<rest>.*)$"         "${p}[REDACTED]${rest}";
    "~^(?<p>/payment/)[^/]+(?<rest>.*)$"                   "${p}[REDACTED]${rest}";
    "~^(?<p>/invoice/)[^/]+(?<rest>.*)$"                   "${p}[REDACTED]${rest}";
    default                                                $uri;
}

# $uri has no query string; no Referer (it can carry the same capability paths).
log_format ms_safe '$remote_addr - [$time_local] "$request_method $ms_loggable_uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent" rt=$request_time host=$host';

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:ms_ssl:10m;
ssl_session_timeout 1h;

# ------------------------------------------------------- default servers ----
# Any Host that is not explicitly configured: close the connection (80) or refuse
# the TLS handshake (443). ACME HTTP-01 is served by each named host's :80 block.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log ms_safe;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/access.log ms_safe;
    ssl_reject_handshake on;
}
