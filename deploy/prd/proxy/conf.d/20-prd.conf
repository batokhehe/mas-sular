# PRODUCTION virtual hosts -> compose project `mas-sular-prd` (network
# mas-sular-prd_edge; upstreams are the prd-* network aliases).
#
#   ecommerce.baksomassular.com  storefront
#   api.baksomassular.com        API
#   admin.baksomassular.com      admin console
#
# Two phases, so a missing certificate can never stop nginx (and take staging
# down with it):
#   PRD_TLS=off  only these :80 blocks — ACME HTTP-01 + redirect. Used to issue
#                the certificate the first time.
#   PRD_TLS=on   additionally loads prd-tls-on/prd.conf (the :443 blocks).
# The switch is PRD_TLS in deploy/prd/proxy/.env (gitignored), which selects the
# directory mounted at /etc/nginx/prd-tls. See deploy/prd/README.md.

server {
    listen 80;
    server_name ecommerce.baksomassular.com api.baksomassular.com admin.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# A wildcard include that matches nothing is valid nginx (PRD_TLS=off).
include /etc/nginx/prd-tls/*.conf;
