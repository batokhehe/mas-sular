# STAGING virtual hosts (staging-*.baksomassular.com) -> compose project `mas-sular`
# (apps/mas-sular, network mas-sular_edge).
#
# Copied VERBATIM from the live staging config (ops/nginx/mas-sular.conf, commit
# f470eef) with exactly one change: upstreams address the staging CONTAINER NAMES
# (mas-sular-<service>-1) instead of the bare service names. This proxy sits on
# both mas-sular_edge and mas-sular-prd_edge, where `backend`/`frontend`/`admin`
# exist twice — a bare service name would resolve to either environment.
#
# The http-level settings (resolver, log format, TLS protocols, default servers)
# moved to 00-global.conf. DELETE THIS FILE when staging is taken down.

# ------------------------------------------------------------- storefront ----
server {
    listen 80;
    server_name staging-ecommerce.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-ecommerce.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        set $ms_upstream http://mas-sular-frontend-1:3000;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------------- API ----
server {
    listen 80;
    server_name staging-api.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-api.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ecommerce.baksomassular.com/privkey.pem;

    # E7: payment-receipt photos. The application enforces a stricter 8 MB cap.
    client_max_body_size 10m;

    # M1: Prometheus metrics are internal-only (scrape backend:3001 on the Docker
    # network). The application refuses proxied /metrics requests as well.
    location = /metrics {
        return 404;
    }

    # M2: JNE Webhook Status V2 has no request authentication, so the edge admits only
    # allowlisted sources (the application enforces the same rule on req.ip).
    # 110.239.85.204 is JNE's webhook source, confirmed in writing. 187.53.139.88 is this
    # staging VPS's own public IP, for controlled internal E2E webhook tests (the
    # application accepts it only via JNE_WEBHOOK_EXTRA_SOURCE_IPS, which is refused at
    # boot when JNE_ENVIRONMENT=production). Anything else gets nginx's 403.
    location = /api/v1/shipments/webhook/jne {
        allow 110.239.85.204;
        allow 187.53.139.88;
        deny all;

        set $ms_upstream http://mas-sular-backend-1:3001;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Paxel webhook: source-IP allowlist as defense in depth. Paxel's confirmed push
    # sources: 34.85.159.153 (non-production) and 34.126.76.148 (production).
    # TEMPORARY: staging and production coexist on this VPS, so BOTH are allowed.
    # When staging is retired, remove `allow 34.85.159.153;` and keep only
    # `allow 34.126.76.148;` (see paxel-webhook.RUNBOOK.md section 4).
    # The application still verifies X-Paxel-Signature (HMAC) on every request; this
    # allowlist is not authentication. Anything else gets nginx's 403 before the
    # backend or the integration log sees it.
    location = /api/v1/shipments/webhook/paxel {
        allow 34.85.159.153;
        allow 34.126.76.148;
        allow 187.53.139.88;   # this staging VPS: controlled internal E2E tests (signature still required)
        deny all;

        set $ms_upstream http://mas-sular-backend-1:3001;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # H2: the admin notification stream (Server-Sent Events). Authenticated by the
    # session cookie - never a URL token. Unbuffered so events arrive immediately;
    # the backend sends a heartbeat every 30s, well inside the read timeout.
    location = /api/v1/admin/notifications/stream {
        set $ms_upstream http://mas-sular-backend-1:3001;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        set $ms_upstream http://mas-sular-backend-1:3001;
        proxy_pass $ms_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

