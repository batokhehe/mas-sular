# PRODUCTION :443 blocks. Loaded only when PRD_TLS=on (deploy/prd/proxy/.env),
# i.e. after the certificate below exists:
#   certbot certonly --webroot -w /opt/mas-sular/nginx/certbot/www \
#     --cert-name ecommerce.baksomassular.com \
#     -d ecommerce.baksomassular.com -d api.baksomassular.com -d admin.baksomassular.com
#
# Same hardening as staging, but with production-only allowlists:
#   - JNE webhook: JNE's confirmed source only — NO VPS / E2E address
#   - Paxel webhook: Paxel's PRODUCTION source only — NOT the non-production one

# ------------------------------------------------------------- storefront ----
server {
    listen 443 ssl;
    server_name ecommerce.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.baksomassular.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        set $ms_upstream http://prd-frontend:3000;
        proxy_pass $ms_upstream;
        proxy_hide_header X-Powered-By;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

# -------------------------------------------------------------------- API ----
server {
    listen 443 ssl;
    server_name api.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.baksomassular.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # E7: payment-receipt photos. The application enforces a stricter 8 MB cap.
    client_max_body_size 10m;

    # M1: Prometheus metrics are internal-only.
    location = /metrics {
        return 404;
    }

    # M2: JNE Webhook Status V2 has no request authentication; only JNE's
    # confirmed source may reach it (the app enforces the same rule on req.ip).
    location = /api/v1/shipments/webhook/jne {
        allow 110.239.85.204;
        deny all;

        set $ms_upstream http://prd-backend:3001;
        proxy_pass $ms_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Paxel webhook: PRODUCTION source IP only (34.85.159.153 is Paxel
    # non-production and stays on staging). The app still verifies
    # X-Paxel-Signature (HMAC) on every request; this is defense in depth.
    location = /api/v1/shipments/webhook/paxel {
        allow 34.126.76.148;
        deny all;

        set $ms_upstream http://prd-backend:3001;
        proxy_pass $ms_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Admin notification stream (Server-Sent Events): unbuffered; the backend
    # heartbeats every 30s, well inside the read timeout.
    location = /api/v1/admin/notifications/stream {
        set $ms_upstream http://prd-backend:3001;
        proxy_pass $ms_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location / {
        set $ms_upstream http://prd-backend:3001;
        proxy_pass $ms_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}

# ------------------------------------------------------------------ admin ----
server {
    listen 443 ssl;
    server_name admin.baksomassular.com;
    access_log /var/log/nginx/access.log ms_safe;

    ssl_certificate /etc/letsencrypt/live/ecommerce.baksomassular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.baksomassular.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        set $ms_upstream http://prd-admin:3002;
        proxy_pass $ms_upstream;
        proxy_hide_header X-Powered-By;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
