# Production broker tuning for a 448M container on a shared 1 vCPU host.
#
# RabbitMQ sizes its memory watermark from the HOST's RAM (3.9 GiB here), not the
# container limit: the default 0.4 relative watermark is ~1.5 GiB, so without this
# file the broker would be OOM-killed long before it applied flow control.
# Measured idle footprint: ~136 MiB. Publishers are throttled at 256MB, leaving
# headroom below the cgroup limit for the overshoot between memory checks.
vm_memory_high_watermark.absolute = 256MB
# Stop accepting messages before the shared disk fills up.
disk_free_limit.absolute = 2GB
