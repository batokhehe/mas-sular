name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5   # version comes from packageManager in package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10 skips dependency build scripts, so @prisma/client is not generated on install.
      - run: pnpm --filter backend prisma:generate
      - run: pnpm lint
      - run: pnpm --filter backend test
      # Type-checks src, prisma and test (jest only compiles the files it loads).
      # Same command as jne-master-import.yml; needs the Prisma Client generated above.
      - run: pnpm exec tsc --noEmit -p tsconfig.json
        working-directory: backend

  # Unit tests of the two Next.js apps (node --test, no services, no network).
  # Separate job so a failure here never hides the backend result above.
  # Path selectors on purpose: frontend's package name is not "frontend".
  web-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5   # version comes from packageManager in package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./${{ matrix.app }} test

  # Production `next build` of both Next.js apps. Informational: not a required
  # check. Build-time values are non-secret local placeholders that satisfy each
  # app's URL contract (see the Dockerfiles), never production endpoints.
  # The frontend build downloads its Google Fonts (next/font/google).
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            api_url: http://localhost:3001/api/v1   # admin: API base incl. /api/v1
          - app: frontend
            api_url: http://localhost:3001          # storefront: bare origin
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${{ matrix.api_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5   # version comes from packageManager in package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./${{ matrix.app }} build

  # Each Docker image installs from its own app directory with that app's lockfile
  # (`pnpm install --frozen-lockfile`, no workspace), so the root install above cannot
  # catch an app lockfile that has fallen behind its package.json.
  app-lockfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5   # version comes from packageManager in package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --lockfile-only --ignore-workspace
        working-directory: ${{ matrix.app }}
